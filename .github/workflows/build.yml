name: Build & Release

# Pushing a tag like 1.2.0 builds everything and publishes release 1.2.0
on:
    push:
        branches: ["*"]
        tags: ["*.*.*", "v*.*.*"]
    pull_request:
        branches: ["*"]

# Needed to attach the built apps to releases
permissions:
    contents: write

jobs:
    build:
        name: Build ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: windows-latest
                      name: windows-amd64
                      goos: windows
                      goarch: amd64
                    - os: ubuntu-latest
                      name: linux-amd64
                      goos: linux
                      goarch: amd64
                    - os: ubuntu-24.04-arm
                      name: linux-arm64
                      goos: linux
                      goarch: arm64
                    - os: macos-latest
                      name: macos-arm64
                      goos: darwin
                      goarch: arm64
                    - os: macos-latest
                      name: macos-amd64
                      goos: darwin
                      goarch: amd64
            fail-fast: false

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: "stable"
                  check-latest: true

            - name: Install Dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libgtk-3-dev

            # Tests need the same C toolchain as the build, so run them once on Linux
            - name: Test
              if: matrix.name == 'linux-amd64'
              run: go test ./internal/tray/ ./internal/config/ ./internal/updater/ ./pkg/...

            - name: Set output filename
              id: vars
              shell: bash
              run: |
                  if [ "$RUNNER_OS" = "Windows" ]; then
                    echo "filename=yeet-${{ matrix.name }}.exe" >> $GITHUB_OUTPUT
                  else
                    echo "filename=yeet-${{ matrix.name }}" >> $GITHUB_OUTPUT
                  fi

            - name: Set build metadata
              id: metadata
              shell: bash
              run: |
                  echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
                  echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  echo "timestamp=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
                  # The version comes from the tag; other builds are 0.0.0
                  if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                    echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
                  else
                    echo "version=0.0.0" >> "$GITHUB_OUTPUT"
                  fi

            - name: Generate Windows icon resource
              if: runner.os == 'Windows'
              working-directory: cmd/desktop
              shell: bash
              run: |
                  versioninfo_args=(
                    -skip-versioninfo
                    -icon=../../assets/icons/icon.ico
                    -o=resource_windows_${{ matrix.goarch }}.syso
                  )
                  if [ "${{ matrix.goarch }}" = "arm64" ]; then
                    versioninfo_args+=(-64 -arm)
                  else
                    versioninfo_args+=(-64)
                  fi
                  go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0 "${versioninfo_args[@]}"

            - name: Build
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: 1
                  MACOSX_DEPLOYMENT_TARGET: "10.14"
                  APP_BUILD: ${{ steps.metadata.outputs.build }}
                  APP_COMMIT: ${{ steps.metadata.outputs.commit }}
                  APP_TIMESTAMP: ${{ steps.metadata.outputs.timestamp }}
                  APP_VERSION: ${{ steps.metadata.outputs.version }}
              shell: bash
              run: |
                  mkdir -p build
                  ldflags="-s -X main.AppVersion=$APP_VERSION -X main.AppBuild=$APP_BUILD -X main.AppCommit=$APP_COMMIT -X main.AppTimestamp=$APP_TIMESTAMP"
                  if [ "$RUNNER_OS" = "Windows" ]; then
                    ldflags="$ldflags -H=windowsgui"
                  fi

                  go build \
                    -trimpath \
                    -buildvcs=false \
                    -tags no_emoji \
                    -ldflags="$ldflags" \
                    -o build/${{ steps.vars.outputs.filename }} \
                    ./cmd/desktop

            - name: Package macOS app bundle
              if: runner.os == 'macOS'
              working-directory: .
              shell: bash
              run: |
                  app_dir="build/yeet-${{ matrix.name }}.app"
                  mkdir -p "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources"

                  install -m 755 \
                    "build/${{ steps.vars.outputs.filename }}" \
                    "$app_dir/Contents/MacOS/puush"
                  install -m 644 \
                    assets/icons/icon.icns \
                    "$app_dir/Contents/Resources/puush.icns"
                  install -m 644 \
                    assets/sounds/success.wav \
                    "$app_dir/Contents/Resources/success.wav"

                  cat > "$app_dir/Contents/Info.plist" <<'PLIST'
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>CFBundleDisplayName</key>
                      <string>puush</string>
                      <key>CFBundleExecutable</key>
                      <string>puush</string>
                      <key>CFBundleIconFile</key>
                      <string>puush.icns</string>
                      <key>CFBundleIdentifier</key>
                      <string>ee.tupsujumal.yeet</string>
                      <key>CFBundleInfoDictionaryVersion</key>
                      <string>6.0</string>
                      <key>CFBundleName</key>
                      <string>puush</string>
                  <key>CFBundlePackageType</key>
                  <string>APPL</string>
                  <key>CFBundleShortVersionString</key>
                  <string>${{ steps.metadata.outputs.version }}</string>
                      <key>CFBundleVersion</key>
                      <string>${{ steps.metadata.outputs.build }}</string>
                      <key>LSMinimumSystemVersion</key>
                      <string>10.14</string>
                      <key>NSHighResolutionCapable</key>
                      <true/>
                      <key>NSScreenCaptureUsageDescription</key>
                      <string>puush needs Screen Recording access to capture screenshots.</string>
                  </dict>
                  </plist>
                  PLIST

                  plutil -lint "$app_dir/Contents/Info.plist"
                  test -x "$app_dir/Contents/MacOS/puush"
                  test -f "$app_dir/Contents/Resources/success.wav"
                  test "$(plutil -extract CFBundleIdentifier raw -o - "$app_dir/Contents/Info.plist")" = "ee.tupsujumal.yeet"
                  test -n "$(plutil -extract NSScreenCaptureUsageDescription raw -o - "$app_dir/Contents/Info.plist")"

                  codesign --force --sign - --requirements '=designated => identifier "ee.tupsujumal.yeet"' --timestamp=none "$app_dir"
                  codesign --verify --strict "$app_dir"

                  ditto -c -k --sequesterRsrc --keepParent \
                    "$app_dir" \
                    "build/yeet-${{ matrix.name }}.app.zip"

            # macOS ships as an .app bundle, the other systems as a single file
            - name: Upload Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: yeet-${{ matrix.name }}
                  path: ${{ runner.os == 'macOS' && format('build/yeet-{0}.app.zip', matrix.name) || format('build/{0}', steps.vars.outputs.filename) }}
                  retention-days: 7

    release:
        name: Publish release
        # Only tags publish; branch pushes just build
        if: startsWith(github.ref, 'refs/tags/')
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Check out the history
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            # The notes are the commits since the previous release, since
            # changes go straight to main rather than through pull requests
            - name: Write release notes
              run: |
                  previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
                  range="${previous:+$previous..}${GITHUB_REF_NAME}"
                  {
                      echo "## What's new"
                      echo
                      git log --no-merges --reverse --format='### %s%n%n%b' "$range" | sed '/^Co-Authored-By:/d; /^Claude-Session:/d'
                      echo
                      if [ -n "$previous" ]; then
                          echo "**All changes:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
                      fi
                  } > release-notes.md
                  cat release-notes.md

            - name: Download builds
              uses: actions/download-artifact@v5
              with:
                  path: dist
                  merge-multiple: true

            - name: Publish release
              uses: softprops/action-gh-release@v3
              with:
                  name: yeet-client ${{ github.ref_name }}
                  body_path: release-notes.md
                  files: dist/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
